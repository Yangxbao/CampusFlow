# ===== 本地开发环境：MySQL 用 Windows 本机 3306；Redis/RocketMQ 用 VMware 虚拟机 192.168.100.128 =====
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:campusflow}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: campusflow-hikari
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123321}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 32
          max-idle: 8
          min-idle: 2
        shutdown-timeout: 100ms

# RocketMQ：复用 VMware 虚拟机内的 NameServer/Broker（192.168.100.128）
campusflow:
  mq:
    name-server: ${ROCKETMQ_NAMESERVER:192.168.100.128:9876}

# JVM 参数建议（本地开发）：
# -Xms512m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Xlog:gc*:file=./logs/gc-dev.log
