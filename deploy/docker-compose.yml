# =====================================================================
# CampusFlow 一键部署（自包含：MySQL/Redis/RocketMQ 全容器化）
# 使用：见根目录 README「Docker 部署」章节
# 注意：RocketMQ Broker 必须向客户端广播可达地址（brokerIP1 指向服务名），
#      否则客户端从 NameServer 拿到容器内部 IP 导致注册/通知链路连接失败
# =====================================================================
name: campusflow

services:
  mysql:
    image: mysql:8.0.34
    container_name: campusflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campusflow123}
      MYSQL_DATABASE: campusflow
      MYSQL_USER: campusflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campusflow123}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --lower_case_table_names=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-campusflow123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campusflow-net

  redis:
    image: redis:6.2.6
    container_name: campusflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123321} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123321}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campusflow-net

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.4
    container_name: campusflow-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campusflow-net

  rocketmq-broker:
    image: apache/rocketmq:4.9.4
    container_name: campusflow-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - broker-store:/home/rocketmq/store
    networks:
      - campusflow-net

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: campusflow-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: campusflow
      MYSQL_USERNAME: campusflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campusflow123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123321}
      ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      JWT_SECRET: ${JWT_SECRET:-campusflow-dev-secret-change-me-32bytes!!}
      CAMPUSFLOW_WORKER_ID: 1
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g -XX:+UseG1GC -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 60s
    networks:
      - campusflow-net

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: campusflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - campusflow-net

volumes:
  mysql-data:
  redis-data:
  broker-store:

networks:
  campusflow-net:
    driver: bridge
