# CampusFlow 前端 Nginx 配置：静态资源 + /api 反向代理到后端
server {
    listen 80;
    server_name _;

    # 前端静态资源（Vue3 历史 路由 fallback）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 TraceId 响应头便于全链路排障
        add_header X-Trace-Id $upstream_http_x_trace_id always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 导出文件下载（长超时）
    location /api/v1/organizer/exports/ {
        proxy_pass http://backend:8080/api/v1/organizer/exports/;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
}
