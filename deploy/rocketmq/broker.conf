# RocketMQ Broker 配置（容器内）
# 关键：brokerIP1 必须是客户端可达地址（容器网络中为服务名；宿主机直连时改为宿主 IP）
brokerClusterName = CampusFlowCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = rocketmq-broker
namesrvAddr = rocketmq-namesrv:9876
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
maxMessageSize = 262144
